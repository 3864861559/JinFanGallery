plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'com.jinfan.gallery'
    compileSdk 34

    defaultConfig {
        applicationId "com.jinfan.gallery"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('fanos-release.jks')
            storePassword 'fanos123456'
            keyAlias 'fanos'
            keyPassword 'fanos123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
